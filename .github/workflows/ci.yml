name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: uraldocs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uraldocs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/uraldocs_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/uraldocs_test
      KB_MODE: demo
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: api
      - name: Apply database migrations
        run: alembic upgrade head
        working-directory: api
      - name: Run full backend suite
        run: pytest -q --junitxml=pytest-report.xml
        working-directory: api
      - name: Require zero skipped backend tests
        run: |
          python - <<'PYCODE'
          from xml.etree import ElementTree

          root = ElementTree.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if skipped:
              raise SystemExit(f"Пропущено backend-тестов: {skipped}")
          PYCODE
        working-directory: api
      - name: Run three mock AI tests
        run: python -m unittest discover -v -s tools -p "test_*.py"
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: api/pytest-report.xml

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
